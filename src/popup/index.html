<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Вхідна документація кафедри</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Вхідна документація кафедри</h1>

      <p class="path">
        <span class="muted">Куди:</span>
        <span id="save-path">…</span>
      </p>

      <p class="account" id="account" hidden>
        <span class="muted">Акаунт:</span>
        <span id="account-email"></span>
        <a href="#" id="sign-out" hidden>Вийти</a>
      </p>

      <p id="status" class="hint">Перевіряю відкриту вкладку…</p>

      <button id="sign-in-btn" type="button" hidden>Увійти в Google</button>

      <dl id="preview" class="preview" hidden>
        <dt>Тема</dt>
        <dd id="pv-subject"></dd>
        <dt>Від кого</dt>
        <dd id="pv-from"></dd>
        <dt>Дата</dt>
        <dd id="pv-date"></dd>
      </dl>

      <button id="save-btn" type="button" disabled>Зберегти</button>

      <p class="footer">
        <a href="#" id="open-options">Налаштування</a>
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
